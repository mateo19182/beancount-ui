[project]
name = "beancount-ui-backend"
version = "0.2.0"
description = "FastAPI backend for beancount-ui"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "beancount>=2.3.0,<3.0.0",
    "pyjwt>=2.12.1",
    "cryptography>=46.0.6",
    "requests>=2.31.0",
    "yfinance>=0.2.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
